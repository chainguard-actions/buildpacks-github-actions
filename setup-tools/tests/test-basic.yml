name: Test basic usage (default versions)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
      - name: Assert binaries installed in $HOME/bin
        run: |
          for b in crane yj; do
            if [ ! -x "$HOME/bin/$b" ]; then
              echo "FAIL: $HOME/bin/$b missing or not executable"
              exit 1
            fi
          done
          echo "PASS"
      - name: Assert $HOME/bin on PATH
        run: |
          echo "PATH=$PATH"
          case ":$PATH:" in
            *":$HOME/bin:"*) echo "PASS" ;;
            *) echo "FAIL: $HOME/bin not in PATH"; exit 1 ;;
          esac
      - name: Assert crane version
        run: |
          V="$("$HOME/bin/crane" version 2>&1 || true)"
          echo "crane version: $V"
          if ! echo "$V" | grep -q "0.19.1"; then
            echo "FAIL: expected crane 0.19.1"
            exit 1
          fi
          echo "PASS"
      - name: Assert yj works
        run: |
          OUT="$(echo '{"a":1}' | "$HOME/bin/yj" -jy)"
          echo "yj output: $OUT"
          if ! echo "$OUT" | grep -q "a: 1"; then
            echo "FAIL: unexpected yj output"
            exit 1
          fi
          echo "PASS"
