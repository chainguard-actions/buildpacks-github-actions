name: Test custom versions
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          crane-version: '0.18.0'
          yj-version: '5.1.0'
      - name: Assert crane custom version is installed
        run: |
          EXPECTED="0.18.0"
          echo "Checking crane version..."
          if ! command -v crane &>/dev/null; then
            echo "FAIL: crane not found in PATH"
            exit 1
          fi
          ACTUAL=$(crane version 2>&1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1 || true)
          echo "Expected crane version: $EXPECTED"
          echo "Actual crane version: $ACTUAL"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "FAIL: crane version mismatch, expected $EXPECTED got $ACTUAL"
            exit 1
          fi
          echo "PASS: crane version matches requested version"
      - name: Assert yj custom version is installed and works
        run: |
          echo "Checking yj..."
          if ! command -v yj &>/dev/null; then
            echo "FAIL: yj not found in PATH"
            exit 1
          fi
          # Test basic functionality
          INPUT='name: test'
          OUTPUT=$(echo "$INPUT" | yj)
          echo "yj output: $OUTPUT"
          if echo "$OUTPUT" | grep -q '"name"'; then
            echo "PASS: yj is functional with custom version"
          else
            echo "FAIL: yj did not produce expected JSON output"
            exit 1
          fi
