name: 'Setup tools'
description: 'Install the tools crane and yj, and add them to $PATH'
author: 'Cloud Native Buildpacks'
inputs:
  crane-version:
    description: 'The version of crane to install'
    required: false
    default: '0.19.1'
  yj-version:
    description: 'The version of yj to install'
    required: false
    default: '5.1.0'
runs:
  using: "composite"
  steps:
    - name: Chainguard usage telemetry
      shell: bash
      run: |
        # Best-effort, fails open. Mints an OIDC token when id-token: write is
        # granted (verified record); otherwise self-reports the repository.
        tok=""
        if [ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ] && [ -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" ]; then
          tok=$(curl -sf --max-time 2 \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=actions.chainguard.dev" \
            | sed -n 's/.*"value":"\([^"]*\)".*/\1/p') || true
        fi
        args=(-sf --max-time 2 -X POST -H "Content-Type: application/json")
        [ -n "$tok" ] && args+=(-H "Authorization: Bearer $tok")
        curl "${args[@]}" \
          -d "{\"repository\":\"${GITHUB_REPOSITORY}\",\"action\":\"${GITHUB_ACTION_REPOSITORY}\"}" \
          "https://actions.enforce.dev/actions/v1/record" >/dev/null 2>&1 || true
    - name: Install additional buildpack management tools
      shell: bash
      env:
        CRANE_VERSION: ${{ inputs.crane-version }}
        YJ_VERSION: ${{ inputs.yj-version }}
      run: |
        #!/usr/bin/env bash

        set -euo pipefail

        mkdir -p "${HOME}"/bin
        safe_path=$(printf '%s' "${PATH}" | tr -d '\n\r')
        echo "PATH=${HOME}/bin:${safe_path}" >> "${GITHUB_ENV}"

        CRANE_PLATFORM="Linux_x86_64"
        if [ $(arch) = "aarch64" ]; then
           CRANE_PLATFORM="Linux_arm64"
        fi
        echo "Installing crane ${CRANE_VERSION}"
        curl \
          --show-error \
          --silent \
          --location \
          --fail \
          --retry 3 \
          --connect-timeout 5 \
          --max-time 60 \
          "https://github.com/google/go-containerregistry/releases/download/v${CRANE_VERSION}/go-containerregistry_${CRANE_PLATFORM}.tar.gz" \
        | tar -C "${HOME}/bin" -xz crane

        echo "Installing yj ${YJ_VERSION}"
        YJ_DOWNLOAD_FILENAME="yj-linux"
        if [[ "${YJ_VERSION}" < "5.1.0" ]]; then
          YJ_PLATFORM=""
        else
          YJ_PLATFORM="-amd64"
        fi
        if [ $(arch) = "aarch64" ]; then
           YJ_PLATFORM="-arm64"
        fi
        curl \
          --show-error \
          --silent \
          --location \
          --fail \
          --retry 3 \
          --connect-timeout 5 \
          --max-time 60 \
          --output "${HOME}/bin/yj" \
          "https://github.com/sclevine/yj/releases/download/v${YJ_VERSION}/${YJ_DOWNLOAD_FILENAME}${YJ_PLATFORM}"
        chmod +x "${HOME}"/bin/yj
