name: Test .tool-versions without pack entry fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create .tool-versions without pack
        run: |
          mkdir -p "$RUNNER_TEMP/np"
          printf 'nodejs 20.0.0\ngolang 1.22.0\n' > "$RUNNER_TEMP/np/.tool-versions"
          echo "VF=$RUNNER_TEMP/np/.tool-versions" >> "$GITHUB_ENV"
      - id: action
        uses: .
        continue-on-error: true
        with:
          pack-version-file: ${{ env.VF }}
      - name: Assert failure
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure"
            exit 1
          fi
          echo "PASS"
