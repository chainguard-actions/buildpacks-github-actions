name: Test pack-version-file with .tool-versions
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          pack-version-file: tests/fixtures/tool-versions/.tool-versions
      - name: Assert pack version
        run: |
          V="$(pack --version)"
          echo "pack version: $V"
          case "$V" in
            0.39.1*) echo "PASS" ;;
            *) echo "FAIL: expected 0.39.1"; exit 1 ;;
          esac
