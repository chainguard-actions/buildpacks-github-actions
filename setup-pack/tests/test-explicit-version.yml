name: Test explicit pack-version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          pack-version: '0.36.0'
      - name: Assert pack version
        run: |
          ACTUAL="$(pack --version)"
          echo "actual: $ACTUAL"
          case "$ACTUAL" in
            0.36.0*) echo "PASS" ;;
            *) echo "FAIL: expected 0.36.0"; exit 1 ;;
          esac
