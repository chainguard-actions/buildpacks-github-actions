name: Test explicit pack-version input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          pack-version: '0.35.1'
      - name: Assert pack is on PATH
        run: |
          echo "Checking pack is available..."
          if ! command -v pack &>/dev/null; then
            echo "FAIL: pack not found on PATH"
            exit 1
          fi
          echo "PASS: pack found at $(command -v pack)"
      - name: Assert pack version matches requested version
        run: |
          VERSION="$(pack --version 2>&1 || true)"
          echo "pack --version: $VERSION"
          if [ -z "$VERSION" ]; then
            echo "FAIL: pack --version returned empty output"
            exit 1
          fi
          # pack --version outputs something like "0.35.1+git-abcdef (linux, amd64)"
          if echo "$VERSION" | grep -q "0.35.1"; then
            echo "PASS: pack version contains '0.35.1'"
          else
            echo "FAIL: expected version '0.35.1' but got '$VERSION'"
            exit 1
          fi
