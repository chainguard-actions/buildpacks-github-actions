name: Test explicit pack-version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          pack-version: 0.38.2
      - name: Assert pack version
        run: |
          V="$(pack --version)"
          echo "actual: $V"
          if ! echo "$V" | grep -q '^0\.38\.2'; then
            echo "FAIL: expected 0.38.2"
            exit 1
          fi
          echo "PASS"
