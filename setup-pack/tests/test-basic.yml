name: Test basic usage (default versions)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
      - name: Assert crane is installed
        run: |
          echo "Checking crane..."
          if ! command -v crane &>/dev/null; then
            echo "FAIL: crane not found in PATH"
            exit 1
          fi
          crane version
          echo "PASS: crane is installed"
      - name: Assert jq is installed
        run: |
          echo "Checking jq..."
          if ! command -v jq &>/dev/null; then
            echo "FAIL: jq not found in PATH"
            exit 1
          fi
          jq --version
          echo "PASS: jq is installed"
      - name: Assert pack is installed
        run: |
          echo "Checking pack..."
          if ! command -v pack &>/dev/null; then
            echo "FAIL: pack not found in PATH"
            exit 1
          fi
          pack --version
          echo "PASS: pack is installed"
      - name: Assert yj is installed
        run: |
          echo "Checking yj..."
          if ! command -v yj &>/dev/null; then
            echo "FAIL: yj not found in PATH"
            exit 1
          fi
          yj --version || true
          echo "PASS: yj is installed"
