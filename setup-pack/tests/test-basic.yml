name: Test basic usage (default version)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
      - name: Assert pack is on PATH
        run: |
          echo "Checking pack is available..."
          if ! command -v pack &>/dev/null; then
            echo "FAIL: pack not found on PATH"
            exit 1
          fi
          echo "PASS: pack found at $(command -v pack)"
      - name: Assert pack version output is non-empty
        run: |
          VERSION="$(pack --version 2>&1 || true)"
          echo "pack --version: $VERSION"
          if [ -z "$VERSION" ]; then
            echo "FAIL: pack --version returned empty output"
            exit 1
          fi
          echo "PASS: pack version is '$VERSION'"
