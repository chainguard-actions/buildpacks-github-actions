name: Test basic default install
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
      - name: Assert pack installed with default version
        run: |
          if ! command -v pack >/dev/null 2>&1; then
            echo "FAIL: pack not on PATH"
            exit 1
          fi
          if [ ! -x "$HOME/bin/pack" ]; then
            echo "FAIL: $HOME/bin/pack missing"
            exit 1
          fi
          V="$(pack --version)"
          echo "actual: $V"
          case "$V" in
            0.40.10*) echo "PASS" ;;
            *) echo "FAIL: expected 0.40.10"; exit 1 ;;
          esac
