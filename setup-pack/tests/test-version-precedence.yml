name: Test pack-version takes precedence over pack-version-file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create .pack-version
        run: |
          mkdir -p "$GITHUB_WORKSPACE/prec-test"
          echo "0.40.10" > "$GITHUB_WORKSPACE/prec-test/.pack-version"
      - id: action
        uses: .
        with:
          pack-version: '0.36.0'
          pack-version-file: prec-test/.pack-version
      - name: Assert pack version
        run: |
          ACTUAL="$(pack --version)"
          echo "actual: $ACTUAL"
          case "$ACTUAL" in
            0.36.0*) echo "PASS" ;;
            *) echo "FAIL: expected 0.36.0"; exit 1 ;;
          esac
