name: Test pack-version takes precedence over pack-version-file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create bogus version file
        run: |
          mkdir -p "$RUNNER_TEMP/pf"
          echo "0.0.0-does-not-exist" > "$RUNNER_TEMP/pf/.pack-version"
          echo "VF=$RUNNER_TEMP/pf/.pack-version" >> "$GITHUB_ENV"
      - id: action
        uses: .
        with:
          pack-version: '0.40.10'
          pack-version-file: ${{ env.VF }}
      - name: Assert version
        run: |
          V="$(pack --version)"
          echo "actual: $V"
          case "$V" in
            0.40.10*) echo "PASS" ;;
            *) echo "FAIL: expected 0.40.10"; exit 1 ;;
          esac
