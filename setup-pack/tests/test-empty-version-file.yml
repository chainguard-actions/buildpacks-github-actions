name: Test comment-only version file fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create comment-only version file
        run: |
          mkdir -p "$RUNNER_TEMP/ef"
          printf '# nothing here\n\n   # still nothing\n' > "$RUNNER_TEMP/ef/.pack-version"
          echo "VF=$RUNNER_TEMP/ef/.pack-version" >> "$GITHUB_ENV"
      - id: action
        uses: .
        continue-on-error: true
        with:
          pack-version-file: ${{ env.VF }}
      - name: Assert failure
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure"
            exit 1
          fi
          echo "PASS"
